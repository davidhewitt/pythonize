name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@6599ee8b7a49aef6a770f63d261d214911a7ce02 # v0.6.0
        with:
          advanced-security: false
          annotations: true

  resolve:
    runs-on: ubuntu-latest
    outputs:
      MSRV: ${{ steps.resolve-msrv.outputs.MSRV }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: resolve MSRV
        id: resolve-msrv
        run: echo MSRV=`python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["rust-version"])'` >> $GITHUB_OUTPUT

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt
      - name: Check rust formatting (rustfmt)
        run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - run: cargo clippy --all

  build:
    needs: [resolve, fmt] # don't wait for clippy as fails rarely and takes longer
    name: python${{ matrix.python-version }} ${{ matrix.os }} rust-${{ matrix.rust}}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # If one platform fails, allow the rest to keep testing.
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.14t", "3.15-dev", "3.15t-dev"]
        os: ["macos-latest", "ubuntu-latest", "windows-latest"]
        rust: [stable]
        include:
          - python-version: "3.14"
            os: "ubuntu-latest"
            rust: ${{ needs.resolve.outputs.MSRV }}
          - python-version: "3.14"
            os: "macos-15-intel"
            rust: "stable"
          - python-version: "3.14"
            os: "ubuntu-24.04-arm"
            rust: "stable"
          - python-version: "3.14"
            os: "windows-11-arm"
            rust: "stable"
          # 3.8 & 3.9 don't have 26.04 builds
          - python-version: "3.8"
            os: "ubuntu-24.04"
            rust: "stable"
          - python-version: "3.9"
            os: "ubuntu-24.04"
            rust: "stable"
        exclude:
          - python-version: "3.8"
            os: "ubuntu-latest"
            rust: "stable"
          - python-version: "3.9"
            os: "ubuntu-latest"
            rust: "stable"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ matrix.rust }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        continue-on-error: true

      - if: ${{ matrix.rust == needs.resolve.outputs.MSRV }}
        name: Set dependencies on MSRV
        run: cargo +stable update
        env:
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback

      - name: Test
        run: cargo test --verbose

      - name: Test (abi3)
        run: cargo test --verbose --features pyo3/abi3-py38

      - name: Test (arbitrary_precision)
        run: cargo test --verbose --features arbitrary_precision

    env:
      RUST_BACKTRACE: 1

  coverage:
    needs: [fmt]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        continue-on-error: true
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@61b160225e09dfa2ea62afd328f7c2eafb5d2e54 # cargo-llvm-cov
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: llvm-tools-preview
      - run: |
          cargo llvm-cov clean
          cargo llvm-cov --codecov --output-path codecov.json
      - uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          file: codecov.json
          token: ${{ secrets.CODECOV_TOKEN }}
